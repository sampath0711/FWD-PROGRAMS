<html>
    <head>
        <style>
            .container{
                display: grid;
                grid-template-columns: ifr ifr ifr;
                gap: 100px;
                border: 200px;
                border: 10px solid black;
                padding: 10px;
            }
            .box{
                background: lightpink;
                padding: 100px;
                text-align: center;
                font-weight: bold;
            }

        </style>
    </head><body>
        <h3>CSS grifdemo </h3>
         <div class="container">
                <div class="box">Box 1</div>
                <div class="box">Box 2</div>
                <div class="box">Box 3</div>    
                </div>
    </body>
</html>
