<html>
    <head>
        <style>
            input:focus{
                background-color: rgb(211, 7, 7);
                border: 2px solid blueviolet;
            }
        </style>
    </head>
    <body>
        <h2>
            CLick the box to see the :focus effect
        </h2>
        <input type="text" placeholder="I changa color when focused!" autofocus>
    </body>
</html>
